<section class="mx-auto mt-10 grid max-w-6xl gap-4 px-5 sm:grid-cols-2 lg:grid-cols-3">
  @for (i of items(); track i.title) {
    <div class="rounded-[1.75rem] glass p-6 shadow-soft">
      <span class="block h-2 w-10 rounded-full" [class]="i.tone ?? 'bg-primary'"></span>
      <h3 class="mt-4 font-display text-subtitle">{{ i.title }}</h3>
      <p class="mt-1.5 text-meta text-muted-foreground">{{ i.body }}</p>
    </div>
  }
</section>
